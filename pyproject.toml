[project]
name = "lob"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Alexandr20i", email = "Alexandr20i@yandex.ru" }
]
requires-python = ">=3.11"
dependencies = [
    "duckdb>=1.5.6",
    "numba>=0.68.0",
    "numpy>=2.4.6",
    "opencv-python>=5.0.0.93",
    "polars>=2.0.0",
    "pydantic>=2.14.0",
    "pyyaml>=6.0.3",
    "scipy>=1.17.1",
    "sortedcontainers>=2.4.0",
]

[project.scripts]
lob = "lob:main"

[build-system]
requires = ["uv_build>=0.13.0,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "hypothesis>=6.168.5",
    "jupyter>=1.1.1",
    "mypy>=2.4.0",
    "pytest>=9.1.1",
    "ruff>=0.17.0",
]
